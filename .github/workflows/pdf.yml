# Re-renders the PDF whenever a push to main changes what it is printed
# from, and commits it to public/ so the site's "PDF" link serves
# the latest one. The bot's own commit does not start this workflow again
# (pushes made with GITHUB_TOKEN never trigger workflows).
name: Render PDF

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - scripts/pdf.mjs
      - vite.config.js
      - package.json
      - package-lock.json
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write

# A newer push makes an older render pointless.
concurrency:
  group: render-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run pdf

      - name: Commit the PDF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/marius-viennot-uxdesign-portfolio.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
            exit 0
          fi
          git commit -m "Re-render the PDF"
          git pull --rebase
          git push
